name: Scheduled Dutch Open-Data & Pool Sync

on:
  schedule:
    - cron: '15 5 * * *' # Daily 05:15 UTC (06:15/07:15 NL time)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.23+
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm 12.14.0
        run: npm install -g pnpm@12.14.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Quarantined Scheduled Sync
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          UPTIME_KUMA_PUSH_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
        run: pnpm sync:scheduled
